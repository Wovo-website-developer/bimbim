<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WOVO // Bespoke High-Performance Web Architecture</title>
  <link rel="icon" type="image/png" href="/assets/logo.png" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Space Grotesk', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'monospace']
          },
          animation: {
            'fade-in': 'fadeIn 0.35s ease-out forwards',
            'pulse-subtle': 'pulseSubtle 3s cubic-bezier(0.4, 0, 0.6, 1) infinite'
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(6px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            },
            pulseSubtle: {
              '0%, 100%': { opacity: '1' },
              '50%': { opacity: '0.6' }
            }
          }
        }
      }
    };
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* Theme Core Standards */
    html.dark body {
      background-color: #09090b;
      color: #f8fafc;
    }
    html.light body {
      background-color: #ffffff;
      color: #0f172a;
    }

    /* Strict High-Contrast Light Theme Overrides */
    html.light #app-root {
      background-color: #ffffff;
      color: #0f172a;
    }

    html.light h1, html.light h2, html.light h3, html.light h4 {
      color: #0f172a;
    }

    /* Custom Scrollbar */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(148, 163, 184, 0.1);
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(6, 182, 212, 0.4);
      border-radius: 9999px;
    }

    /* RTL Support Helpers */
    [dir="rtl"] {
      text-align: right;
    }
    [dir="rtl"] .tracking-widest {
      letter-spacing: normal;
    }
    
    body {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-neutral-950 text-white selection:bg-cyan-400 selection:text-black">
  <div id="app-root"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
