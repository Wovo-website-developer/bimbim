<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WOVO // Modern AI-Assisted Website Development</title>
  <link rel="icon" type="image/png" href="/assets/logo.png" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Space Grotesk', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'monospace']
          },
          animation: {
            'fade-in': 'fadeIn 0.4s ease-out forwards'
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(8px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            }
          }
        }
      }
    };
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* High Contrast Theme Core Rules */
    html.dark body {
      background-color: #09090b;
      color: #ffffff;
    }
    html.light body {
      background-color: #f8fafc;
      color: #0f172a;
    }

    /* Light mode text contrast overrides */
    html.light h1, html.light h2, html.light h3, html.light h4 {
      color: #0f172a !important;
    }
    html.light p {
      color: #334155 !important;
    }
    html.light .bg-neutral-900\/60,
    html.light .bg-neutral-900\/80,
    html.light .bg-neutral-900\/40,
    html.light .bg-neutral-900 {
      background-color: #ffffff !important;
      border-color: #cbd5e1 !important;
      color: #0f172a !important;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    }
    html.light .bg-neutral-950 {
      background-color: #f1f5f9 !important;
      border-color: #cbd5e1 !important;
      color: #0f172a !important;
    }
    html.light .text-neutral-400,
    html.light .text-neutral-300 {
      color: #475569 !important;
    }
    html.light .text-white {
      color: #0f172a !important;
    }
    html.light .bg-white\/5 {
      background-color: #f1f5f9 !important;
      border-color: #cbd5e1 !important;
    }
    html.light .bg-white {
      background-color: #0f172a !important;
      color: #ffffff !important;
    }

    /* Custom Scrollbar */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(6, 182, 212, 0.5);
      border-radius: 9999px;
    }

    /* RTL Support Helpers */
    [dir="rtl"] {
      text-align: right;
    }
    [dir="rtl"] .tracking-widest {
      letter-spacing: normal;
    }
    
    body {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-neutral-950 text-white selection:bg-cyan-500 selection:text-black">
  <div id="app-root"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
